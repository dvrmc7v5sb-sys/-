<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dating invite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
body{
  min-height:100vh;
  background:linear-gradient(145deg,#0b0514,#200b38,#081822);
  color:#fff;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(circle at 10% 15%,rgba(180,80,255,0.08) 0,transparent 20%),
    radial-gradient(circle at 90% 85%,rgba(0,210,210,0.07) 0,transparent 20%);
  pointer-events:none;
}
.deco-border{
  position:fixed;
  inset:12px;
  border:1px solid rgba(160,40,255,0.25);
  border-radius:24px;
  pointer-events:none;
}
.deco-item{
  position:fixed;
  color:rgba(180,100,255,0.18);
  font-size:28px;
  pointer-events:none;
}
.deco1{top:30px;left:30px;content:"⊹";}
.deco2{bottom:40px;right:35px;content:"⦿";}
.deco3{top:40%;left:22px;content:"✦";}
.deco4{bottom:30%;right:28px;content:"⊕";}
.container{
  width:100%;
  max-width:520px;
  position:relative;
  z-index:2;
}
.card{
  background:rgba(18,12,30,0.78);
  border-radius:22px;
  padding:32px 24px;
  border:1px solid rgba(130,30,230,0.32);
  box-shadow:0 0 30px rgba(145,40,255,0.18);
  text-align:center;
  transition:opacity 0.33s ease;
}
.page{display:none;opacity:0;transition:opacity 0.33s ease;}
.page.active{display:block;opacity:1;}
.avatar{
  width:130px;height:130px;
  border-radius:50%;
  margin:0 auto 20px;
  border:2px solid #b24cff;
  box-shadow:0 0 16px #8c28ff66;
  object-fit:cover;
  background:#221036;
  display:flex;
  align-items:center;justify-content:center;
  font-size:42px;color:#b24cff;
}
h2{font-size:26px;margin-bottom:16px;font-weight:bold;}
p{font-size:16px;line-height:1.6;margin-bottom:18px;color:#e9e9e9;}
.tip-text{font-size:14px;color:#b4b4b4;margin-top:24px;}
.btn-wrap{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:24px;}
button{
  padding:14px 28px;
  border-radius:14px;
  border:none;
  font-size:16px;font-weight:bold;
  cursor:pointer;
  transition:all 0.18s ease;
}
button:active{transform:scale(0.95);}
.btn-purple{
  background:linear-gradient(90deg,#992eff,#b85cff);
  color:#fff;
  box-shadow:0 0 12px #992eff55;
}
.btn-gray{
  background:#3a3a48;color:#d2d2d2;
  position:relative;
}
.input-row{margin:16px 0;text-align:left;}
label{display:block;margin-bottom:8px;font-size:15px;color:#ddd;}
input[type="date"],input[type="time"]{
  width:100%;
  padding:13px 16px;
  border-radius:12px;
  background:#1b1430;
  border:1px solid #7722cc77;
  color:#fff;
  font-size:16px;
}
.mode-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;margin:24px 0;
}
.mode-btn{
  background:#282042;color:#ddd;
  border:1px solid #442070;
}
.mode-btn.selected{
  background:linear-gradient(90deg,#992eff,#b85cff);
  color:#fff;border-color:#b24cff;
  box-shadow:0 0 10px #992eff44;
}
.result-card{
  background:rgba(30,20,50,0.65);
  border-radius:18px;
  padding:22px;margin:22px 0;
  border:1px solid rgba(178,76,255,0.28);
}
.result-item{margin:12px 0;font-size:16px;}
@media(max-width:420px){
  .mode-grid{grid-template-columns:repeat(2,1fr);}
  .btn-wrap{flex-direction:column;}
  button{width:100%;}
}
</style>
</head>
<body>
<div class="deco-border"></div>
<div class="deco-item deco1">⊹</div>
<div class="deco-item deco2">⦿</div>
<div class="deco-item deco3">✦</div>
<div class="deco-item deco4">⊕</div>

<div class="container">
  <!-- Page1 初始邀约页 -->
  <div class="page active" id="page1">
    <div class="card">
      <div class="avatar">🐱</div>
      <h2>可以和我一起打瓦吗？</h2>
      <div class="btn-wrap">
        <button class="btn-purple" onclick="goPage(2)">愿意</button>
        <button class="btn-gray" id="noBtn">不要</button>
      </div>
      <p class="tip-text">系统检测到，对方已经紧张到开始空枪了。</p>
    </div>
  </div>

  <!-- Page2 惊喜确认页 -->
  <div class="page" id="page2">
    <div class="card">
      <h2>等下，你真的点了愿意？？我都已经准备好被你点“不要”了。</h2>
      <div class="btn-wrap">
        <button class="btn-purple" onclick="goPage(3)">好眼光喔—</button>
      </div>
    </div>
  </div>

  <!-- Page3 时间选择页 -->
  <div class="page" id="page3">
    <div class="card">
      <h2>所以…你什么时候有空开一把？</h2>
      <div class="input-row">
        <label>选择日期</label>
        <input type="date" id="selDate">
      </div>
      <div class="input-row">
        <label>选择时间（12:00–18:00整点）</label>
        <input type="time" id="selTime" min="12:00" max="18:00" step="3600">
      </div>
      <div class="btn-wrap">
        <button class="btn-purple" onclick="goPage(4)">确定时间</button>
      </div>
    </div>
  </div>

  <!-- Page4 模式多选页 -->
  <div class="page" id="page4">
    <div class="card">
      <h2>我们玩点什么？</h2>
      <div class="mode-grid">
        <button class="mode-btn" data-val="爆破">爆破</button>
        <button class="mode-btn" data-val="夺旗">夺旗</button>
        <button class="mode-btn" data-val="死斗">死斗</button>
        <button class="mode-btn" data-val="极速模式">极速模式</button>
        <button class="mode-btn" data-val="排位">排位</button>
        <button class="mode-btn" data-val="休闲">休闲</button>
        <button class="mode-btn" data-val="Spikerush">Spikerush</button>
        <button class="mode-btn" data-val="竞技">竞技</button>
        <button class="mode-btn" data-val="其他">其他</button>
      </div>
    </div>
  </div>

  <!-- Page5 新增位置选择页 -->
  <div class="page" id="page5">
    <div class="card">
      <h2>选择一下你的位置</h2>
      <div class="btn-wrap">
        <button class="btn-gray" id="duelBtn">决斗</button>
        <button class="btn-gray" id="initBtn">先锋</button>
        <button class="btn-gray" id="sentryBtn">哨位</button>
        <button class="btn-purple" onclick="selectRole('天才烟位')">天才烟位</button>
      </div>
    </div>
  </div>

  <!-- Page6 结果确认页 -->
  <div class="page" id="page6">
    <div class="card">
      <div class="avatar">🐱</div>
      <h2>真开心你没有拒绝，我会准时上线等你！</h2>
      <div class="result-card">
        <div class="result-item">日期：<span id="resDate"></span></div>
        <div class="result-item">时间：<span id="resTime"></span></div>
        <div class="result-item">模式：<span id="resMode"></span></div>
        <div class="result-item">位置：<span id="resRole"></span></div>
      </div>
      <p>带好你的准星，我带好霓虹。</p>
    </div>
  </div>
</div>

<script>
// 全局存储
const data = {date:"",time:"",modes:[],role:""};
const pages = document.querySelectorAll(".page");

// 页面切换
function goPage(num){
  pages.forEach(p=>{
    p.classList.remove("active");
  })
  const target = document.getElementById("page"+num);
  setTimeout(()=>target.classList.add("active"),50);
  if(num===4){bindModeBtns();}
  if(num===6){renderResult();}
  if(num===5){bindRoleEscapeBtns();}
}

// 【不要按钮】鼠标悬浮随机移动
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseenter",()=>{
  const ww = window.innerWidth - noBtn.offsetWidth - 40;
  const hh = window.innerHeight - noBtn.offsetHeight -40;
  const rx = Math.random()*ww;
  const ry = Math.random()*hh;
  noBtn.style.position="fixed";
  noBtn.style.left = rx+"px";
  noBtn.style.top = ry+"px";
})

// 位置页逃跑按钮绑定
function bindRoleEscapeBtns(){
  const duelBtn = document.getElementById("duelBtn");
  const initBtn = document.getElementById("initBtn");
  const sentryBtn = document.getElementById("sentryBtn");
  function makeEscape(btn){
    btn.addEventListener("mouseenter",()=>{
      const ww = window.innerWidth - btn.offsetWidth - 40;
      const hh = window.innerHeight - btn.offsetHeight -40;
      const rx = Math.random()*ww;
      const ry = Math.random()*hh;
      btn.style.position="fixed";
      btn.style.left = rx+"px";
      btn.style.top = ry+"px";
    })
  }
  makeEscape(duelBtn);
  makeEscape(initBtn);
  makeEscape(sentryBtn);
}

// 选择位置
function selectRole(roleName){
  data.role = roleName;
  goPage(6);
}

// 初始化日期，默认今天
const dateInput = document.getElementById("selDate");
const timeInput = document.getElementById("selTime");
const now = new Date();
dateInput.valueAsDate = now;
dateInput.min = now.toISOString().split('T')[0];
timeInput.value = "12:00";

// 模式多选绑定
function bindModeBtns(){
  data.modes = [];
  document.querySelectorAll(".mode-btn").forEach(btn=>{
    btn.classList.remove("selected");
    btn.onclick = function(){
      const val = this.dataset.val;
      if(this.classList.contains("selected")){
        this.classList.remove("selected");
        data.modes = data.modes.filter(x=>x!==val);
      }else{
        this.classList.add("selected");
        data.modes.push(val);
      }
      // 选完至少一项自动跳【位置选择页 page5】
      if(data.modes.length>0){
        data.date = dateInput.value;
        data.time = timeInput.value;
        setTimeout(()=>goPage(5),320);
      }
    }
  })
}

// 渲染结果页
function renderResult(){
  document.getElementById("resDate").innerText = data.date;
  document.getElementById("resTime").innerText = data.time;
  document.getElementById("resMode").innerText = data.modes.join("、");
  document.getElementById("resRole").innerText = data.role;
}
</script>
</body>
</html>
